# ModBot rules. Read-only defaults: thresholds live here (and change
# rules_version); per-rule enforce state is seeded into the database the
# first time a rule id is seen, and after that only `/modbot enforce`
# changes it.
#
# Thresholds are per rule AND per trigger ("auto" = every message,
# "report" = a member reported it). All values are illustrative starting
# points until the auto dry-run (gate G3) calibrates them.
#
# Only categories listed here can ever cause a deletion. A report lowers the
# evidence needed for a prohibited category; it never makes generic
# offensiveness prohibited.
#
# All matching rules are evaluated; the strongest outcome wins.

- id: CHILD_SAFETY
  categories: [sexual/minors]
  delete_if_flagged: true        # OpenAI's own flag deletes on any trigger
  # Initially delete on the classifier's category flag only. Numeric scores
  # below its own flag are logged for calibration, never automatic deletion.
  log_at: 0.10                   # 0.10 up to a delete: posted to #mod-logs, no ping
  ignores_dry_run: true          # live from day one, by policy
  ignores_context: true          # quotation/humor context never suppresses this rule
  redact: true                   # message text never stored or posted
  ping: true                     # flagged deletions ping the moderator role
  default_enforce: true

- id: HATE_THREAT
  categories: [hate/threatening]
  delete_at: {auto: 0.85, report: 0.65}
  escalate_at: 0.50
  default_enforce: false

- id: THREAT
  # Directed threats only. General violent content (fiction, news, game talk)
  # is a separate signal below and never shares a max() with this rule.
  categories: [harassment/threatening]
  delete_at: {auto: 0.80, report: 0.60}
  escalate_at: 0.60
  default_enforce: false
  suppress_if: {}                # Phase 2: e.g. {QUOTATION: 0.7, SELF_DIRECTED: 0.8}

- id: VIOLENT_CONTENT
  # Violent description is not a violation by itself on this server.
  # Flag-and-keep only: no delete_at, so it can never delete.
  categories: [violence]
  escalate_at: 0.90
  default_enforce: false

# SEXUAL_THREAT and GROUP_VIOLENCE have no OpenAI category; they arrive with
# the Phase 2 local model, with thresholds measured on that model's scores.
